name = "juwon-electric-api"
main = "src/index.js"
# Newest date supported by the installed wrangler 4.132.0 / workerd 1.20260915.1.
compatibility_date = "2026-09-15"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "juwon-electric"
database_id = "cb59a683-d80a-4b77-9929-2485f99f09cd"

# Daily low-stock digest at 07:00 UTC (08:00 in Lagos). See src/ops/inventory.js.
[triggers]
crons = ["0 7 * * *"]
