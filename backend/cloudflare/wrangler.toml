name = "juwon-electric-api"
main = "src/index.js"
# Newest date supported by the installed wrangler 4.132.0 / workerd 1.20260915.1.
compatibility_date = "2026-09-15"
# Plain-text vars are set in the Cloudflare dashboard (docs/DEPLOYMENT.md). Keep them on deploy instead
# of listing them under [vars], so private values stay out of git.
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "juwon-electric"
database_id = "cb59a683-d80a-4b77-9929-2485f99f09cd"

# Uploaded images (docs/agents/UPLOADS_V1.md). Create the bucket before the first deploy:
#   wrangler r2 bucket create juwon-electric-images
# `wrangler dev --local` simulates it. See docs/DEPLOYMENT.md.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "juwon-electric-images"

# Daily at 07:00 UTC (08:00 in Lagos): low-stock digest (src/ops/inventory.js), then the upload
# sweep, usage reconcile and private storage alert (src/uploads.js).
[triggers]
crons = ["0 7 * * *"]
